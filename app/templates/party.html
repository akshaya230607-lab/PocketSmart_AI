{% extends 'base.html' %}{% block content %}<section class="pagehead"><p class="eyebrow">PARTY PLANNER</p><h1>Build an event budget that makes sense.</h1></section><section class="card form"><form id="partyForm"><label>Total budget (₹)<input name="budget" type="number" min="1" required placeholder="50000"></label><label>Guests<input name="guests" type="number" min="1" required placeholder="50"></label><label>Event type<select name="event_type"><option>Birthday</option><option>Wedding</option><option>Corporate</option><option>Anniversary</option><option>Other</option></select></label><label>Venue<input name="venue" value="Indoor"></label><label>City<input name="city" placeholder="Chennai"></label><label>Notes<textarea name="notes"></textarea></label><button class="btn primary">Generate Party Plan</button></form></section><div id="results"></div>{% endblock %}
