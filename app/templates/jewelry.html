{% extends 'base.html' %}{% block content %}<section class="pagehead"><p class="eyebrow">JEWELRY PLANNER</p><h1>Find a look that fits your occasion and budget.</h1></section><section class="card form"><form id="jewelryForm" enctype="multipart/form-data"><label>Budget (₹)<input name="budget" type="number" min="1" required placeholder="5000"></label><label>Occasion<select name="occasion"><option>Wedding</option><option>Party</option><option>Festive</option><option>Office</option><option>Date Night</option></select></label><label>Style<select name="style"><option>Elegant</option><option>Minimal</option><option>Traditional</option><option>Statement</option></select></label><label>Metal<select name="metal"><option>Any</option><option>Gold Tone</option><option>Silver Tone</option><option>Pearl</option></select></label><label>Outfit image (optional)<input name="image" type="file" accept="image/png,image/jpeg,image/webp"></label><label>Notes<textarea name="notes" placeholder="e.g. match a blue saree"></textarea></label><button class="btn primary">Generate Jewelry Plan</button></form></section><div id="results"></div>{% endblock %}
